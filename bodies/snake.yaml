color: [132, 169, 60]

defaults:
  segment:
    width: 0.08
    mass: 0.4
    friction: 1.0
  joint:
    min_angle: -45
    max_angle: 45
    max_torque: 10
    max_speed: 570
    gain: 25

segments:
  - {name: s0, from: [0.0, 0.045], to: [0.3, 0.045]}
  - {name: s1, from: [0.3, 0.045], to: [0.6, 0.045]}
  - {name: s2, from: [0.6, 0.045], to: [0.9, 0.045]}
  - {name: s3, from: [0.9, 0.045], to: [1.2, 0.045]}
  - {name: s4, from: [1.2, 0.045], to: [1.5, 0.045]}
  - {name: s5, from: [1.5, 0.045], to: [1.8, 0.045]}
  - {name: s6, from: [1.8, 0.045], to: [2.1, 0.045]}
  - {name: s7, from: [2.1, 0.045], to: [2.4, 0.045]}

joints:
  - {between: [s0, s1], at: [0.3, 0.045]}
  - {between: [s1, s2], at: [0.6, 0.045]}
  - {between: [s2, s3], at: [0.9, 0.045]}
  - {between: [s3, s4], at: [1.2, 0.045]}
  - {between: [s4, s5], at: [1.5, 0.045]}
  - {between: [s5, s6], at: [1.8, 0.045]}
  - {between: [s6, s7], at: [2.1, 0.045]}
