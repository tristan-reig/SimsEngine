name: Sauteur
color: [155, 110, 200]

defaults:
  segment:
    width: 0.08
    mass: 0.8
    friction: 1.0
  joint:
    min_angle: -45
    max_angle: 45
    max_torque: 60
    max_speed: 570
    gain: 8

segments:
  - {name: tronc, from: [0.05, 0.85], to: [0.35, 1.15], width: 0.16, mass: 3.0}
  - {name: queue, from: [0.05, 0.85], to: [-0.6, 0.04], width: 0.06}
  - {name: cuisse, from: [0.05, 0.85], to: [0.05, 0.45], mass: 1.0}
  - {name: tibia, from: [0.05, 0.45], to: [0.05, 0.08], mass: 0.6}
  - {name: pied, from: [-0.12, 0.045], to: [0.28, 0.045], width: 0.07, mass: 0.4}

joints:
  - {between: [tronc, cuisse], at: [0.05, 0.85]}
  - {between: [cuisse, tibia], at: [0.05, 0.45], min_angle: -90, max_angle: 10}
  - {between: [tibia, pied], at: [0.05, 0.08], min_angle: -30, max_angle: 30}
  - {between: [tronc, queue], at: [0.05, 0.85], min_angle: -30, max_angle: 30}
